name: kasset-trader
# 어떤 Ubuntu VPS에서도 그대로 실행되는 구성 — 클라우드 전용 서비스 없음.
# 이전 절차는 docs/runbooks/vps-migration.md 참고.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"
# 공통 runtime env는 API, MCP, worker, scheduler, 일회성 migration에
# 필요한 모든 KASSET_AI_* route 설정을 함께 전달한다.
x-kasset-runtime-env-file: &kasset-runtime-env-file .env.kasset
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: kasset
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kasset
    volumes:
      - postgres_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasset -d kasset"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  api:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    volumes:
      - /opt/kasset-nhplug:/home/appuser/.nhplug
      - /usr/local/bin/codex:/usr/local/bin/codex:ro
      - /usr/local/bin/codex-code-mode-host:/usr/local/bin/codex-code-mode-host:ro
      - /opt/kasset-codex:/var/lib/kasset-codex
      - ./research_contracts:/app/research_contracts:ro
      - ./research:/app/research:ro
    environment:
      CODEX_HOME: /var/lib/kasset-codex
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    logging: *default-logging
    restart: unless-stopped

  mcp:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
    environment:
      MCP_TYPE: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8768"
      MCP_PROFILE: analysis_readonly
      MCP_AUTH_TOKEN: ${MCP_ANALYSIS_AUTH_TOKEN}
    ports:
      - "127.0.0.1:8768:8768"
    # 이미지 HEALTHCHECK(api :8000)를 MCP 포트로 교정
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8768/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    logging: *default-logging
    command: ["python", "-m", "app.mcp_server.main"]
    volumes:
      - ./research_contracts:/app/research_contracts:ro
      - ./research:/app/research:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migration:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles: ["migration"]

  worker:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    command: ["/app/.venv/bin/taskiq", "worker", "app.core.taskiq_broker:broker", "app.tasks.kasset_market_events_tasks", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 이미지에서 상속되는 api용 HEALTHCHECK 무효화(taskiq는 HTTP 미제공)
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    command: ["/app/.venv/bin/taskiq", "scheduler", "app.core.scheduler:sched", "app.tasks.kasset_market_events_tasks"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

  # 오리진 직접 TLS 엣지. Cloudflare 프록시를 벗어나면 오리진이 스스로
  # 인증서를 제시해야 한다. Caddyfile은 deploy/kasset/Caddyfile 공용본을 쓴다.
  # KASSET_DOMAIN 은 쉼표로 여러 호스트를 넣을 수 있다(전환 중 병행 운용).
  caddy:
    image: caddy:2.11.4-alpine
    volumes:
      - ./deploy/kasset/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/kasset-tailnet-certs:/etc/caddy/tailnet:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      KASSET_DOMAIN: ${KASSET_DOMAIN:?KASSET_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      # Empty user config expands to an internal Caddy import sentinel, which
      # omits the optional MagicDNS site block without creating a blank address.
      KASSET_TAILNET_DOMAIN: "${KASSET_TAILNET_DOMAIN:-import kasset_tailnet_disabled}"
      # Space-delimited IPv4/IPv6 CIDRs. Unset or empty remains tailnet-only.
      KASSET_ADMIN_ALLOWED_IPS: "${KASSET_ADMIN_ALLOWED_IPS:-100.64.0.0/10 fd7a:115c:a1e0::/48}"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
