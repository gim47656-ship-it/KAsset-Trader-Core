name: kasset-trader
# 어떤 Ubuntu VPS에서도 그대로 실행되는 구성 — 클라우드 전용 서비스 없음.
# 이전 절차는 docs/runbooks/vps-migration.md 참고.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"
# 공통 runtime env는 API, MCP, worker, scheduler, 일회성 migration에
# 필요한 모든 KASSET_AI_* route 설정을 함께 전달한다.
x-kasset-runtime-env-file: &kasset-runtime-env-file .env.kasset
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: kasset
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kasset
    volumes:
      - postgres_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasset -d kasset"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  api:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VCS_REF: ${VCS_REF:-}
        GITHUB_SHA: ${VCS_REF:-unknown}
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    volumes:
      - /opt/kasset-nhplug:/home/appuser/.nhplug
      - /usr/local/bin/codex:/usr/local/bin/codex:ro
      - /usr/local/bin/codex-code-mode-host:/usr/local/bin/codex-code-mode-host:ro
      - /opt/kasset-codex:/var/lib/kasset-codex
      - ./research_contracts:/app/research_contracts:ro
      - ./research:/app/research:ro
    environment:
      CODEX_HOME: /var/lib/kasset-codex
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Caddy runs in host networking and reaches this loopback publish directly;
    # keep it aligned with deploy/kasset/Caddyfile's 127.0.0.1:8000 upstream.
    ports:
      - "127.0.0.1:8000:8000"
    logging: *default-logging
    restart: unless-stopped

  mcp:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
    environment:
      MCP_TYPE: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8768"
      MCP_PROFILE: analysis_readonly
      MCP_AUTH_TOKEN: ${MCP_ANALYSIS_AUTH_TOKEN}
    ports:
      - "127.0.0.1:8768:8768"
    # 이미지 HEALTHCHECK(api :8000)를 MCP 포트로 교정
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8768/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    logging: *default-logging
    command: ["python", "-m", "app.mcp_server.main"]
    volumes:
      - ./research_contracts:/app/research_contracts:ro
      - ./research:/app/research:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # AI provider 전용 MCP sidecar. 위 `mcp`(analysis_readonly 거래 도구 서버)와
  # 다른 프로세스이며 `run_skill` 도구 하나만 노출한다. broker/account/order
  # 도구가 없고 DB/Redis에도 붙지 않으므로 depends_on이 없다.
  #
  # ports를 두지 않는다. compose 기본 backend 네트워크에서만 닿고, Caddy는 host
  # 네트워크로 돌며 이 서비스의 site block도 없으므로 공개 경로가 존재하지 않는다.
  #
  # env_file을 붙이지 않는다. DB·JWT·broker 자격을 sidecar에 주입하지 않는 최소
  # 권한 경계다. sidecar는 app.core.config 전체 Settings를 읽지 않고 아래 환경변수만
  # 본다. 값은 `--env-file .env.kasset` 보간으로 들어온다.
  #
  # profiles 옵트인이므로 기본 `up -d`로는 뜨지 않는다. 활성화 절차:
  #   1) .env.kasset에 KASSET_AI_SIDECAR_TOKEN / KASSET_AI_SIDECAR_CMD 설정
  #   2) docker compose --env-file .env.kasset -f docker-compose.kasset.yml \
  #        --profile ai-mcp up -d ai-mcp
  #   3) api/worker 쪽 KASSET_AI_MCP_URL=http://ai-mcp:8770/mcp 와
  #      KASSET_AI_MCP_TOKEN=<KASSET_AI_SIDECAR_TOKEN 과 동일> 설정 후 재기동
  ai-mcp:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    profiles: ["ai-mcp"]
    command: ["python", "-m", "app.extensions.kasset.ai_mcp_sidecar.server"]
    environment:
      # 비어 있으면 기동을 실패시킨다. 잘못된 설정으로 서비스하지 않는다.
      KASSET_AI_SIDECAR_CMD: "${KASSET_AI_SIDECAR_CMD:-}"
      KASSET_AI_SIDECAR_TOKEN: "${KASSET_AI_SIDECAR_TOKEN:-}"
      KASSET_AI_SIDECAR_HOST: "0.0.0.0"
      KASSET_AI_SIDECAR_PORT: "8770"
      KASSET_AI_SIDECAR_PATH: "/mcp"
      # 호출자 KASSET_AI_MCP_TIMEOUT_SECONDS(기본 30초)보다 넉넉히 크게 둔다.
      # 느린 CLI는 호출자 timeout(=가용성 실패)으로 먼저 드러나야 기존
      # direct/OpenRouter fallback이 돌고, sidecar가 계약 오류로 lane을 닫지 않는다.
      KASSET_AI_SIDECAR_TIMEOUT_SECONDS: "${KASSET_AI_SIDECAR_TIMEOUT_SECONDS:-90}"
      # 동시 처리 상한. 포화 시 HTTP 429로 즉시 거절해 호출자가 fallback한다.
      KASSET_AI_SIDECAR_MAX_CONCURRENCY: "${KASSET_AI_SIDECAR_MAX_CONCURRENCY:-2}"
      CODEX_HOME: /var/lib/kasset-codex
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    # 구독 CLI 바이너리와 운영자 인증 디렉터리만 마운트한다(api 서비스와 동일 자산).
    volumes:
      - /usr/local/bin/codex:/usr/local/bin/codex:ro
      - /usr/local/bin/codex-code-mode-host:/usr/local/bin/codex-code-mode-host:ro
      - /opt/kasset-codex:/var/lib/kasset-codex
    # 이미지 HEALTHCHECK(api :8000)를 sidecar 포트로 교정
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8770/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  migration:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles: ["migration"]

  worker:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    command: ["/app/.venv/bin/taskiq", "worker", "app.core.taskiq_broker:broker", "app.tasks.kasset_market_events_tasks", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 이미지에서 상속되는 api용 HEALTHCHECK 무효화(taskiq는 HTTP 미제공)
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    image: kasset-trader-core:${CORE_IMAGE_TAG:-latest}
    env_file:
      - *kasset-runtime-env-file
      - .env.nhplug-mock.native
    command: ["/app/.venv/bin/taskiq", "scheduler", "app.core.scheduler:sched", "app.tasks.kasset_market_events_tasks"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

  # 오리진 직접 TLS 엣지. Cloudflare 프록시를 벗어나면 오리진이 스스로
  # 인증서를 제시해야 한다. Caddyfile은 deploy/kasset/Caddyfile 공용본을 쓴다.
  # KASSET_DOMAIN 은 쉼표로 여러 호스트를 넣을 수 있다(전환 중 병행 운용).
  caddy:
    image: caddy:2.11.4-alpine
    # Tailscale userspace forwarding is SNATed to the Docker bridge gateway.
    # Host networking preserves the real Tailnet IPv4/IPv6 peer for Caddy's
    # immediate-peer admin allowlist.
    network_mode: host
    volumes:
      - ./deploy/kasset/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/kasset-tailnet-certs:/etc/caddy/tailnet:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      KASSET_DOMAIN: ${KASSET_DOMAIN:?KASSET_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      # Shared only between Caddy and the API runtime; required so Caddy
      # cannot start without the production admin-ingress proof.
      KASSET_ADMIN_EDGE_KEY: ${KASSET_ADMIN_EDGE_KEY:?KASSET_ADMIN_EDGE_KEY must be set}
      # Empty user config expands to an internal Caddy import sentinel, which
      # omits the optional MagicDNS site block without creating a blank address.
      KASSET_TAILNET_DOMAIN: "${KASSET_TAILNET_DOMAIN:-import kasset_tailnet_disabled}"
      # Space-delimited IPv4/IPv6 CIDRs. Unset or empty remains tailnet-only.
      KASSET_ADMIN_ALLOWED_IPS: "${KASSET_ADMIN_ALLOWED_IPS:-100.64.0.0/10 fd7a:115c:a1e0::/48}"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
