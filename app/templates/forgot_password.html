{% extends "base.html" %}

{% block title %}비밀번호 복구 - Auto Trader{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="/static/css/auth.css">
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>비밀번호 복구</h1>
        <p id="recovery-description">가입한 이메일로 비밀번호 재설정 안내를 보내드립니다</p>

        {% if error %}
        <div class="error-message" role="alert">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-message" role="status">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/web-auth/forgot-password" aria-describedby="recovery-description">
            <input type="hidden" name="csrftoken" value="{{ request.state.csrftoken }}">
            <div class="form-group">
                <label for="email">이메일</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    autofocus
                    placeholder="email@example.com"
                    value="{{ email or '' }}"
                >
            </div>

            <button type="submit" class="btn-primary">복구 이메일 받기</button>
        </form>

        <div class="divider">또는</div>

        <div class="login-link">
            <a href="/web-auth/login">로그인으로 돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}
